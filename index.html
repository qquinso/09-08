<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Special Surprise</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- GIFT SCREEN -->
  <main id="gift-screen">

    <div class="gift-container" onclick="openGift()">

      <div class="gift">
        <div class="lid"></div>
        <div class="box"></div>
        <div class="ribbon-vertical"></div>
        <div class="ribbon-horizontal"></div>
        <div class="bow"></div>
      </div>

      <p class="click-text">CLICK ME!!!</p>

    </div>

  </main>


  <!-- BIRTHDAY CONTENT -->
  <section id="birthday-content">

    <div class="birthday-message">
      <h1>HAPPY BIRTHDAY A-MIGO</h1>
    </div>


    <!-- PHOTOS -->
    <div class="photo-gallery">

      <div class="photo-card">
        <img src="images/pic1.jpg" alt="Memory">
      </div>

      <div class="photo-card">
        <img src="images/pic2.jpg" alt="Memory">
      </div>

      <div class="photo-card">
        <img src="images/pic3.jpg" alt="Memory">
      </div>

    </div>

  </section>


  <script src="script.js"></script>

</body>
</html>
